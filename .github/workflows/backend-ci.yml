name: AXON LunarSight Backend CI & Container Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_dem_tests:
        description: "Download LOLA DEMs and run DEM-dependent tests"
        required: false
        default: false
        type: boolean

jobs:
  scientific-test:
    name: Scientific Engine & API Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (GDAL / Spatial)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-7 libgdal-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -e ./science/
          pip install pytest pytest-asyncio httpx

      - name: Fetch NAIF SPICE Kernels
        run: |
          python pipeline/fetch_kernels.py

      - name: Verify SPICE Kernel Checksums
        run: |
          python pipeline/step2_kernels.py

      - name: Download LOLA DEMs (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dem_tests }}
        run: |
          python pipeline/download_dems.py --download

      - name: Verify LOLA DEM Checksums (terrain.lock)
        run: |
          # DEMs are large (~1.5 GB) and are not required for the default CI
          # suite; DEM-dependent tests are skipped when the assets are absent.
          if [ -d terrain ] && find terrain -name '*.JP2' -print -quit | grep -q .; then
            python pipeline/download_dems.py
          else
            echo "No LOLA DEM assets present; skipping checksum verification."
          fi

      - name: Run Full Pytest Suite
        run: |
          python -m pytest science/tests/ -v

  container-build-smoke:
    name: Docker Build & Smoke Test
    needs: scientific-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker Image
        run: |
          docker build -t axon-lunarsight-backend:ci -f Dockerfile .

      - name: Run Docker Container
        run: |
          docker run -d --name axon-api -p 8000:8000 -e AXON_ENV=production axon-lunarsight-backend:ci

      - name: Container Readiness Check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/ready | grep -q '"ready":true'; then
              echo "Container is scientifically ready."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become ready. Final readiness response:"
          curl -fsS http://localhost:8000/api/ready || true
          docker logs axon-api || true
          exit 1

      - name: Container Stop & Cleanup
        if: always()
        run: |
          docker stop axon-api || true
          docker rm axon-api || true
