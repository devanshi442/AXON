# ── Artemis III Candidate Landing Regions (Tier 2-D) ────────────────────────
# All coordinates: planetocentric latitude, east-positive longitude.
# Sourced from NASA Artemis III updates (NASA Release 24-136, Oct 28 2024; NASA Release 22-087, Aug 19 2022),
# LPI Constellation/Artemis Landing Site Studies, and USGS Gazetteer.
# Each region is a ~15×15 km bounding area; centroid or primary peak recorded.
candidate_sites:

  - id: cs-shackleton-rim
    record_type: candidate_site
    name: "Peak Near Shackleton (Artemis III Candidate Region)"
    lat_center: -89.68
    lon_center: 129.0
    coord_type: planetocentric_east_positive
    region_size_km: 15
    uncertainty_km: 7.5
    source_url: "https://www.nasa.gov/news-release/nasa-identifies-candidate-regions-for-artemis-iii-lunar-landing/"
    source_alt: "https://www.lpi.usra.edu/lunar/constellation/landing_sites/connecting_ridge/"
    source_date: "2022-08-19"
    notes: >
      Centroid at ~89.68°S, 129.0°E on the high-standing ridge adjacent to Shackleton crater rim.
      Evaluated summit landing site identified at -89.017°S, 126.273°E (LPI / Spudis et al. 2008).
      Prolonged illumination (>80% annual daylight) and direct line-of-sight to Earth.
    verified: true

