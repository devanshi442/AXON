[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lunarsight_core"
version = "0.1.0"
description = "AXON LunarSight — science engine for lunar surface geometry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "spiceypy>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_kernels: test requires SPICE kernel files in kernels/ (skip with -m 'not needs_kernels')",
    "needs_network: test requires network access (Horizons, NAIF)",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
